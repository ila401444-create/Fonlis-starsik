
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-33 build-tools;33.0.2'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Install export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -oq Godot_v4.3-stable_export_templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Android export
        run: |
          test -n "$ANDROID_HOME"
          test -n "$JAVA_HOME"

          sed -i \
            's|gradle_build/use_gradle_build=true|gradle_build/use_gradle_build=false|' \
            export_presets.cfg

          sed -i \
            's|keystore/debug=""|keystore/debug="/home/runner/.android/debug.keystore"|' \
            export_presets.cfg

          sed -i \
            's|keystore/debug_user="androiddebugkey"|keystore/debug_user="androiddebugkey"|' \
            export_presets.cfg

          sed -i \
            's|keystore/debug_password="android"|keystore/debug_password="android"|' \
            export_presets.cfg

          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

          echo "Android SDK: $ANDROID_HOME"
          echo "Java: $JAVA_HOME"
          grep -E 'gradle_build/use_gradle_build|keystore/debug=' export_presets.cfg

      - name: Import project
        run: godot --headless --editor --path . --quit

      
      - name: Export APK
        timeout-minutes: 8
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          echo "=== Export preset ==="
          cat export_presets.cfg

          echo "=== Android template ==="
          ls -la "$HOME/.local/share/godot/export_templates/4.3.stable/"

          echo "=== Export APK ==="
          mkdir -p build
          godot --headless --verbose --path . \
            --export-debug "Android" build/FonlisStars.apk 2>&1 | tee export.log

          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            echo "=== Export diagnostics ==="
            grep -i -E 'error|invalid|missing|android|keystore|template' export.log || true
            exit "$result"
          fi

          test -s build/FonlisStars.apk


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FonlisStars-debug-apk
          path: build/FonlisStars.apk
          if-no-files-found: error
